# Altar Forge layout (6 rows / 54 slots). No animation: every slot is static.
#
#       0     1    2    3    4     5   6    7   8   (FILL = auto fill button, AMT = result amount button)
# r0    BACK  .    .    .   INFO   .   .    .   X
# r1    .     .    .    C1   C2    C3  .    .  SYR
# r2    .     .   FILL   C4   IN    C5  AMT OUT  .
# r3    .     .    .    C6   C7    C8  .    %   .
# r4    .    BST1 BST2 BST3  GO    .  PRT   .   .
# r5    G1    G2   G3   G4   G5    G6  G7   G8  G9      (static chance gauge)
#
# Pure data: change slots / items / theme freely. Slots must be 0-53 and must not overlap.
# A broken file is reported in the console and the built-in copy of this file is used instead.
# Texts: {gui.some.key} comes from the language file, {station} / {path} / ... from the plugin,
# %placeholders% from PlaceholderAPI.

config-version: 4
rows: 6                       # must be 6
title: '&8✦ &#FFD700&lAltar Forge &8» &7{station}'

theme:
  border: BLACK_STAINED_GLASS_PANE
  filler: GRAY_STAINED_GLASS_PANE

slots:
  info: 4
  input: 22
  rune-ring: [13, 21, 23, 31, 12, 14, 30, 32]   # order in which item costs fill the rune slots
  output-preview: 25
  requirements: 17
  chance: 34
  booster: [37, 38, 39]       # a path uses the first `chance.booster-slots` of them
  protection: 42
  upgrade-button: 40
  back: 0
  cancel: 8
  chance-gauge: [45, 46, 47, 48, 49, 50, 51, 52, 53]
  # Optional buttons (leave them out to hide them):
  autofill: 20                # moves the item and the required materials from your inventory into the slots
  amount: 24                  # result amount: left click +, right click -, shift click reset
  # Optional: one status pane per rune slot (same order as rune-ring), e.g. rune-status: [3, 5]

# Items accept: material, name, lore, glow, custom-model-data, item-model.
# Anything you leave out falls back to the built-in default.
items:
  upgrade-button:
    ready:     { material: LIME_CONCRETE, name: '{gui.upgrade-button.ready}', glow: true }
    not-ready: { material: RED_CONCRETE, name: '{gui.upgrade-button.not-ready}' }
  rune-empty:    { material: LIGHT_GRAY_STAINED_GLASS_PANE, name: '{gui.rune.empty.name}' }
  rune-missing:  { material: RED_STAINED_GLASS_PANE }
  rune-ok:       { material: LIME_STAINED_GLASS_PANE }
  rune-locked:   { material: BLACK_STAINED_GLASS_PANE, name: ' ' }
  gauge:         # plain materials: the chance gauge (red < 30%, yellow 30-70%, green > 70%)
    low: RED_STAINED_GLASS_PANE
    mid: YELLOW_STAINED_GLASS_PANE
    high: LIME_STAINED_GLASS_PANE
    off: GRAY_STAINED_GLASS_PANE
