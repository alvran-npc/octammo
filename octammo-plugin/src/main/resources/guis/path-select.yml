# Path menu of a station (6 rows). Shown when a station has more than one path.
# The same layout is used for the station list of /itemupgrade without arguments.
config-version: 3
rows: 6
title: '&8✦ &#FFD700&lAltar Forge &8» &7{station}'

theme:
  border: BLACK_STAINED_GLASS_PANE
  filler: GRAY_STAINED_GLASS_PANE

slots:
  info: 4
  paths: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  close: 49

items:
  info:  { material: ENCHANTING_TABLE, name: '{station}', lore: ['{gui.path.info}'] }
  close: { material: BARRIER, name: '{gui.close}' }
