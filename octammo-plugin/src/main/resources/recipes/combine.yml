# OctaMMO Combine Station recipes.
# Add up to six ingredients. Each ingredient is inserted into its own GUI slot.
# Supported ingredient/result types: MATERIAL and MMOITEMS.
# MMOItems are matched by their exact Type and Item ID.
recipes:
  reforged_diamond_blade:
    name: "Reforged Diamond Blade"
    description:
      - "Combine an iron blade with refined materials."
      - "This sample recipe is ready to use on a fresh installation."
    ingredients:
      - type: MATERIAL
        material: IRON_SWORD
        amount: 1
      - type: MATERIAL
        material: DIAMOND
        amount: 2
      - type: MATERIAL
        material: IRON_INGOT
        amount: 4
    result:
      type: MATERIAL
      material: DIAMOND_SWORD
      amount: 1

